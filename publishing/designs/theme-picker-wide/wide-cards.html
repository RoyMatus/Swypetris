  function save() {
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({ modelContent: { theme: selected }, privateContent: null }).catch(() =&gt; {});
    }

    themes.forEach(theme =&gt; {

      button.className = &#x27;sw-theme cursor-interaction&#x27;;

      button.style.setProperty(&#x27;--theme-text&#x27;, theme.text);
      button.style.setProperty(&#x27;--theme-sprite&#x27;, &#x27;url(&quot;&#x27; + theme.sprite + &#x27;&quot;)&#x27;);

      sample.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);

  function fitStage() {
