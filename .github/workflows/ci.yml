name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks for changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci/select_checks.py --base "$BASE_SHA" --output "$GITHUB_OUTPUT"
      - name: Check GitHub API scripts
        if: steps.changes.outputs.github_scripts == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $result = Invoke-Pester ./tools/tests/GitHub-Api.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
      - name: Check release script syntax
        if: steps.changes.outputs.release_scripts == 'true'
        shell: pwsh
        run: |
          Get-ChildItem ./tools/release -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$($_.Name): $($errors -join '; ')" }
          }
      - name: Check CI selection scripts
        if: steps.changes.outputs.ci_scripts == 'true'
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.mode != 'none' || (vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '')
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.changes.outputs.mode != 'none' || (vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '')
      - name: Build and lint app
        if: steps.changes.outputs.mode != 'none'
        run: bash ./gradlew :app:assembleDebug :app:lintDebug --console=plain
      - name: Run selected JVM tests
        if: steps.changes.outputs.mode == 'selected' && steps.changes.outputs.jvm != ''
        env:
          JVM_CLASSES: ${{ steps.changes.outputs.jvm }}
        run: |
          IFS=, read -ra classes <<< "$JVM_CLASSES"
          filters=()
          for class in "${classes[@]}"; do filters+=(--tests "$class"); done
          bash ./gradlew :app:testDebugUnitTest "${filters[@]}" --console=plain
      - name: Run full JVM regression and coverage
        if: steps.changes.outputs.mode == 'full'
        run: bash ./gradlew :app:test :app:jacocoDebugUnitTestReport --console=plain
      - name: Enable KVM
        if: steps.changes.outputs.mode != 'none'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run affected Android tests and smoke
        if: steps.changes.outputs.mode != 'none'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CHECK_MODE: ${{ steps.changes.outputs.mode }}
          ANDROID_CLASSES: ${{ steps.changes.outputs.android }}
        with:
          api-level: 35
          arch: x86_64
          emulator-port: 5554
          disable-animations: false
          script: bash tools/ci/run_android_checks.sh
      - name: Save test, lint, and coverage reports
        if: always() && steps.changes.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
            app/build/reports/jacoco/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: SonarQube Cloud analysis
        if: >-
          vars.SONAR_ORGANIZATION != '' &&
          vars.SONAR_PROJECT_KEY != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo 'SONAR_TOKEN is missing. Add it as a repository Actions secret.' >&2
            exit 1
          fi
          bash ./gradlew sonar --console=plain
