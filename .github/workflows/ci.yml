name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, and fast JVM tests (PR)
        if: github.event_name == 'pull_request'
        run: bash ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:jacocoDebugUnitTestReport --console=plain
      - name: Build, lint, and all JVM tests (main)
        if: github.event_name == 'push'
        run: bash ./gradlew :app:assembleDebug :app:lintDebug :app:test :app:jacocoDebugUnitTestReport --console=plain
      - name: Save test, lint, and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
            app/build/reports/jacoco/
          if-no-files-found: warn
      - name: 'SonarQube Cloud analysis (configuration pending in #63)'
        if: >-
          vars.SONAR_ORGANIZATION != '' &&
          vars.SONAR_PROJECT_KEY != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo 'SONAR_TOKEN is missing. Add it as a repository Actions secret.' >&2
            exit 1
          fi
          bash ./gradlew sonar --console=plain
