name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['gradle.properties']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: [self-hosted, windows, X64, swypetris-android]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks for changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci/select_checks.py --base $env:BASE_SHA --output $env:GITHUB_OUTPUT
      - name: Check GitHub API scripts
        id: github_scripts
        if: steps.changes.outputs.github_scripts == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $result = Invoke-Pester ./tools/tests/GitHub-Api.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
      - name: Check release script syntax
        id: release_scripts
        if: steps.changes.outputs.release_scripts == 'true'
        shell: pwsh
        run: |
          Get-ChildItem ./tools/release -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$($_.Name): $($errors -join '; ')" }
          }
      - name: Check CI selection scripts
        id: ci_scripts
        if: steps.changes.outputs.ci_scripts == 'true'
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() && steps.changes.outputs.mode != 'none' }}
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: ${{ !cancelled() && steps.changes.outputs.mode != 'none' }}
      - name: Analyze Kotlin
        id: detekt
        if: ${{ !cancelled() && steps.changes.outputs.mode != 'none' }}
        run: ./gradlew.bat :app:detekt --console=plain
      - name: Build and lint app
        id: build
        if: ${{ !cancelled() && steps.changes.outputs.mode != 'none' }}
        run: ./gradlew.bat :app:assembleDebug :app:lintDebug --build-cache --console=plain
      - name: Run JVM tests and coverage
        id: jvm
        if: ${{ !cancelled() && steps.changes.outputs.mode != 'none' }}
        env:
          CHECK_MODE: ${{ steps.changes.outputs.mode }}
        run: |
          if ($env:CHECK_MODE -eq 'full') {
            ./gradlew.bat :app:test :app:jacocoDebugUnitTestReport --console=plain
          } else {
            ./gradlew.bat :app:jacocoDebugUnitTestReport --console=plain
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate quality reports
        id: quality_reports
        if: ${{ !cancelled() && steps.changes.outputs.mode != 'none' }}
        run: python3 tools/ci/verify_quality_results.py
      - name: SonarQube Cloud analysis
        id: sonar
        if: ${{ success() && steps.changes.outputs.mode != 'none' }}
        env:
          TRUSTED_CONTEXT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ($env:TRUSTED_CONTEXT -ne 'true') {
            throw 'App changes require a trusted branch for token-based Sonar analysis.'
          }
          if (-not $env:SONAR_ORGANIZATION -or -not $env:SONAR_PROJECT_KEY -or -not $env:SONAR_TOKEN) {
            throw 'App changes require SONAR_ORGANIZATION, SONAR_PROJECT_KEY, and SONAR_TOKEN.'
          }
          ./gradlew.bat sonar '-Dsonar.qualitygate.wait=true' --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run affected Android tests and smoke
        id: device
        if: ${{ success() && steps.changes.outputs.mode != 'none' }}
        env:
          CHECK_MODE: ${{ steps.changes.outputs.mode }}
          ANDROID_CLASSES: ${{ steps.changes.outputs.android }}
        run: ./tools/ci/run_windows_android_checks.ps1 -CheckMode $env:CHECK_MODE -AndroidClasses $env:ANDROID_CLASSES
      - name: Build full regression evidence
        if: ${{ success() && steps.changes.outputs.mode == 'full' }}
        env:
          CHECK_OUTPUTS: ${{ toJSON(steps.changes.outputs) }}
          CHECK_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/full_regression_proof.py
      - name: Save full regression evidence
        if: ${{ success() && steps.changes.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/ci/full-regression-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Save test, lint, and coverage reports
        if: always() && steps.changes.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
            app/build/reports/jacoco/
            app/build/reports/detekt/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Verify required checks executed
        if: always()
        env:
          CHECK_OUTPUTS: ${{ toJSON(steps.changes.outputs) }}
          CHECK_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/verify_quality_results.py --steps
