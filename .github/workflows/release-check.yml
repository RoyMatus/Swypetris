name: Release verification

on:
  workflow_run:
    workflows: [Android CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing version tag on main history; verification only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  context:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      version: ${{ steps.context.outputs.version }}
      publish: ${{ steps.context.outputs.publish }}
      source_run_id: ${{ steps.context.outputs.source_run_id }}
      source_attempt: ${{ steps.context.outputs.source_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted release context before candidate checkout
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/release_context.py resolve

  regression:
    needs: context
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify completed same-commit full cloud regression
        if: needs.context.outputs.publish == 'true'
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
          SOURCE_RUN: ${{ needs.context.outputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ needs.context.outputs.source_attempt }}
        run: python3 ../control/tools/ci/wait_for_android_ci.py --sha "$RELEASE_SHA" --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT" --no-wait
      - name: Check release policy tools
        working-directory: control
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Check release PowerShell tools
        working-directory: control
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq '6.2.0')) {
            Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 6.2.0
          $result = Invoke-Pester ./tools/tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: needs.context.outputs.publish != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: needs.context.outputs.publish != 'true'
      - name: Manual full JVM regression, debug lint, detekt and coverage
        if: needs.context.outputs.publish != 'true'
        run: bash ./gradlew :app:detekt :app:assembleDebug :app:lintDebug :app:test :app:jacocoDebugUnitTestReport :app:assembleDebugAndroidTest --console=plain
      - name: Validate manual quality reports
        if: needs.context.outputs.publish != 'true'
        run: python3 ../control/tools/ci/verify_quality_results.py
      - name: SonarQube Cloud manual release analysis
        if: needs.context.outputs.publish != 'true'
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BRANCH: ${{ inputs.tag || 'main' }}
        run: |
          test -n "$SONAR_ORGANIZATION" && test -n "$SONAR_PROJECT_KEY" && test -n "$SONAR_TOKEN"
          bash ./gradlew sonar "-Dsonar.branch.name=$SONAR_BRANCH" -Dsonar.qualitygate.wait=true --console=plain
          bash ./gradlew --stop
      - name: Enable manual emulator acceleration
        if: needs.context.outputs.publish != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Manual full Android instrumentation and launch smoke
        if: needs.context.outputs.publish != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CHECK_MODE: full
          ANDROID_CLASSES: ''
        with:
          api-level: 35
          arch: x86_64
          avd-name: SwypetrisCI35
          emulator-port: 5556
          emulator-build: '15917651'
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: cd candidate && bash ../control/tools/ci/run_cloud_android_checks.sh
      - name: Save regression evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-regression
          path: |
            candidate/app/build/ci/verified-main-regression.json
            candidate/app/build/reports/
            candidate/app/build/test-results/
            candidate/app/build/outputs/androidTest-results/
          if-no-files-found: warn

  signed-release:
    needs: [context, regression]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore application and upload signing keys from GitHub Secrets
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.SWYPETRIS_APP_KEYSTORE_BASE64 }}
          APP_STORE_PASSWORD: ${{ secrets.SWYPETRIS_APP_STORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.SWYPETRIS_APP_KEY_ALIAS }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.SWYPETRIS_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.SWYPETRIS_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.SWYPETRIS_UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$APP_KEYSTORE_BASE64" ] || [ -z "$APP_STORE_PASSWORD" ] || [ -z "$APP_KEY_ALIAS" ] ||
             [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_STORE_PASSWORD" ] || [ -z "$UPLOAD_KEY_ALIAS" ]; then
            echo 'Release signing secrets are missing. See publishing/CI.md.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swypetris-app.p12"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swypetris-upload.p12"
      - name: Build signed APK with application key
        env:
          SWYPETRIS_STORE_FILE: ${{ runner.temp }}/swypetris-app.p12
          SWYPETRIS_STORE_PASSWORD: ${{ secrets.SWYPETRIS_APP_STORE_PASSWORD }}
          SWYPETRIS_KEY_ALIAS: ${{ secrets.SWYPETRIS_APP_KEY_ALIAS }}
        run: bash ./gradlew :app:assembleRelease :app:lintRelease --console=plain
      - name: Build signed AAB with upload key
        env:
          SWYPETRIS_STORE_FILE: ${{ runner.temp }}/swypetris-upload.p12
          SWYPETRIS_STORE_PASSWORD: ${{ secrets.SWYPETRIS_UPLOAD_STORE_PASSWORD }}
          SWYPETRIS_KEY_ALIAS: ${{ secrets.SWYPETRIS_UPLOAD_KEY_ALIAS }}
        run: bash ./gradlew :app:bundleRelease --console=plain
      - name: Verify release artifacts
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/bundle/release/app-release.aab
          # Android upload keys are self-signed, so jarsigner -strict rejects a valid AAB.
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-verification.txt"
          grep -q '^jar verified\.$' "$RUNNER_TEMP/aab-verification.txt"
          expected_app=$(openssl x509 -in publishing/certificates/swypetris-app.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected_upload=$(openssl x509 -in publishing/certificates/swypetris-upload.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual_app=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          actual_upload=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$actual_app" && test "$actual_app" = "$expected_app"
          test -n "$actual_upload" && test "$actual_upload" = "$expected_upload"
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab
      - name: Stop build daemons before signed release device verification
        run: bash ./gradlew --stop --console=plain
      - name: Enable KVM for signed release verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual signed release on a clean headless device
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          avd-name: SwypetrisCI35
          emulator-port: 5556
          emulator-build: '15917651' # Same stable binary as required cloud CI.
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: cd candidate && python3 ../control/tools/ci/release_smoke.py --serial emulator-5556 --apk app/build/outputs/apk/release/app-release.apk --output app/build/release-smoke
      - name: Save signed release runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-smoke
          path: candidate/app/build/release-smoke/
          if-no-files-found: warn
      - name: Save release shrinker diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-shrinker-reports
          path: candidate/app/build/outputs/mapping/release/
          if-no-files-found: warn
      - name: Save verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: |
            candidate/app/build/outputs/apk/release/app-release.apk
            candidate/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare GitHub APK and update metadata
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Swypetris.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$aapt"
          "$aapt" dump badging release/Swypetris.apk > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re
          badging = pathlib.Path(os.environ['RUNNER_TEMP'], 'apk-badging.txt').read_text()
          match = re.search(r"^package: name='ru\.itoltec\.swypetris' versionCode='(\d+)' versionName='(\d+\.\d+\.\d+)'", badging, re.M)
          if not match or int(match[1]) <= 0:
              raise SystemExit('Signed APK package/version is invalid')
          configured = re.findall(r'^swypetrisVersion=(\d+\.\d+\.\d+)$', pathlib.Path('gradle.properties').read_text(), re.M)
          if configured != [match[2]]:
              raise SystemExit('Signed APK version differs from release configuration')
          metadata = {'versionCode': int(match[1]), 'versionName': match[2], 'sha256': hashlib.sha256(pathlib.Path('release/Swypetris.apk').read_bytes()).hexdigest()}
          pathlib.Path('release/update.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON
          (cd release && sha256sum Swypetris.apk update.json > SHA256SUMS.txt)
      - name: Save GitHub release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-release
          path: candidate/release/
          if-no-files-found: error

      - name: Remove temporary signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/swypetris-app.p12" "$RUNNER_TEMP/swypetris-upload.p12"

  publish:
    needs: [context, regression, signed-release]
    if: >-
      !cancelled() && github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.context.outputs.publish == 'true' &&
      needs.regression.result == 'success' && needs.signed-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: github-release
          path: candidate/release
      - name: Recheck current CI attempt and bind publication provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
        run: python3 ../control/tools/ci/release_context.py provenance --sha "$RELEASE_SHA" --output publication-provenance.json
      - name: Verify tag identity and publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('release/update.json'))['versionName'])")
          test "$version" = "$RELEASE_VERSION"
          (cd release && sha256sum --check SHA256SUMS.txt)
          python3 ../control/tools/ci/release_context.py tag --sha "$RELEASE_SHA" --version "$version" --create
          notes_file="publishing/release-notes-v$version.md"
          if [ -f "$notes_file" ]; then
            gh release create "v$version" --verify-tag --title "Swypetris $version" --notes-file "$notes_file" release/Swypetris.apk release/update.json release/SHA256SUMS.txt
          else
            gh release create "v$version" --verify-tag --title "Swypetris $version" --generate-notes release/Swypetris.apk release/update.json release/SHA256SUMS.txt
          fi
      - name: Save publication provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/publication-provenance.json
          if-no-files-found: error
