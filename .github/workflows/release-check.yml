name: Release verification

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['gradle.properties']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: CI selector tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: GitHub API script tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $result = Invoke-Pester ./tools/tests/GitHub-Api.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
      - name: Release script syntax
        shell: pwsh
        run: |
          Get-ChildItem ./tools/release -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$($_.Name): $($errors -join '; ')" }
          }
      - name: Analyze Kotlin
        run: bash ./gradlew :app:detekt --console=plain
      - name: Full JVM regression, debug lint, and coverage
        run: bash ./gradlew :app:assembleDebug :app:lintDebug :app:test :app:jacocoDebugUnitTestReport --console=plain
      - name: Validate quality reports
        run: python3 tools/ci/verify_quality_results.py
      - name: SonarQube Cloud release analysis
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_TOKEN" ]; then
            echo 'SonarQube Cloud configuration is missing.' >&2
            exit 1
          fi
          bash ./gradlew sonar "-Dsonar.branch.name=$GITHUB_REF_NAME" -Dsonar.qualitygate.wait=true --console=plain
      - name: Save JVM, lint, and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
            app/build/reports/jacoco/
            app/build/reports/detekt/
          if-no-files-found: warn

  instrumented-tests:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify same-commit full cloud regression
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/wait_for_android_ci.py
      - uses: actions/setup-java@v4
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      - name: Enable KVM
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android instrumentation and launch smoke test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CHECK_MODE: full
          ANDROID_CLASSES: ''
        with:
          api-level: 35
          arch: x86_64
          emulator-port: 5554
          disable-animations: false
          script: bash tools/ci/run_android_checks.sh
      - name: Save instrumentation reports
        if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Save verified main regression gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-main-regression
          path: app/build/ci/verified-main-regression.json
          if-no-files-found: error

  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore application and upload signing keys from GitHub Secrets
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.SWYPETRIS_APP_KEYSTORE_BASE64 }}
          APP_STORE_PASSWORD: ${{ secrets.SWYPETRIS_APP_STORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.SWYPETRIS_APP_KEY_ALIAS }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.SWYPETRIS_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.SWYPETRIS_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.SWYPETRIS_UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$APP_KEYSTORE_BASE64" ] || [ -z "$APP_STORE_PASSWORD" ] || [ -z "$APP_KEY_ALIAS" ] ||
             [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_STORE_PASSWORD" ] || [ -z "$UPLOAD_KEY_ALIAS" ]; then
            echo 'Release signing secrets are missing. See publishing/CI.md.' >&2
            exit 1
          fi
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swypetris-app.p12"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swypetris-upload.p12"
      - name: Build signed APK with application key
        env:
          SWYPETRIS_STORE_FILE: ${{ runner.temp }}/swypetris-app.p12
          SWYPETRIS_STORE_PASSWORD: ${{ secrets.SWYPETRIS_APP_STORE_PASSWORD }}
          SWYPETRIS_KEY_ALIAS: ${{ secrets.SWYPETRIS_APP_KEY_ALIAS }}
        run: bash ./gradlew :app:assembleRelease :app:lintRelease --console=plain
      - name: Build signed AAB with upload key
        env:
          SWYPETRIS_STORE_FILE: ${{ runner.temp }}/swypetris-upload.p12
          SWYPETRIS_STORE_PASSWORD: ${{ secrets.SWYPETRIS_UPLOAD_STORE_PASSWORD }}
          SWYPETRIS_KEY_ALIAS: ${{ secrets.SWYPETRIS_UPLOAD_KEY_ALIAS }}
        run: bash ./gradlew :app:bundleRelease --console=plain --rerun-tasks
      - name: Verify release artifacts
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/bundle/release/app-release.aab
          # Android upload keys are self-signed, so jarsigner -strict rejects a valid AAB.
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-verification.txt"
          grep -q '^jar verified\.$' "$RUNNER_TEMP/aab-verification.txt"
          expected_app=$(openssl x509 -in publishing/certificates/swypetris-app.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected_upload=$(openssl x509 -in publishing/certificates/swypetris-upload.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual_app=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          actual_upload=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$actual_app" && test "$actual_app" = "$expected_app"
          test -n "$actual_upload" && test "$actual_upload" = "$expected_upload"
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab
      - name: Stop build daemons before signed release device verification
        run: bash ./gradlew --stop --console=plain
      - name: Enable KVM for signed release verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual signed release on a clean headless device
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          emulator-port: 5556
          emulator-build: '15917651' # Same stable binary as required cloud CI.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: python3 tools/ci/release_smoke.py --serial emulator-5556 --apk app/build/outputs/apk/release/app-release.apk --output app/build/release-smoke
      - name: Save signed release runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-smoke
          path: app/build/release-smoke/
          if-no-files-found: warn
      - name: Save release shrinker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-shrinker-reports
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn
      - name: Save verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare GitHub APK and update metadata
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Swypetris.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$aapt"
          "$aapt" dump badging release/Swypetris.apk > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re
          badging = pathlib.Path(os.environ['RUNNER_TEMP'], 'apk-badging.txt').read_text()
          match = re.search(r"^package: name='ru\.itoltec\.swypetris' versionCode='(\d+)' versionName='(\d+\.\d+\.\d+)'", badging, re.M)
          if not match or int(match[1]) <= 0:
              raise SystemExit('Signed APK package/version is invalid')
          configured = re.findall(r'^swypetrisVersion=(\d+\.\d+\.\d+)$', pathlib.Path('gradle.properties').read_text(), re.M)
          if configured != [match[2]]:
              raise SystemExit('Signed APK version differs from release configuration')
          metadata = {'versionCode': int(match[1]), 'versionName': match[2], 'sha256': hashlib.sha256(pathlib.Path('release/Swypetris.apk').read_bytes()).hexdigest()}
          pathlib.Path('release/update.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON
          (cd release && sha256sum Swypetris.apk update.json > SHA256SUMS.txt)
      - name: Save GitHub release files
        uses: actions/upload-artifact@v4
        with:
          name: github-release
          path: release/
          if-no-files-found: error

  publish:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.regression.result == 'success' && needs.instrumented-tests.result == 'success' && needs.signed-release.result == 'success' }}
    needs: [regression, instrumented-tests, signed-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Recheck current full CI attempt before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/wait_for_android_ci.py
      - uses: actions/download-artifact@v5
        with:
          name: github-release
          path: release
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('release/update.json'))['versionName'])")
          (cd release && sha256sum --check SHA256SUMS.txt)
          notes_file="publishing/release-notes-v$version.md"
          if [ -f "$notes_file" ]; then
            gh release create "v$version" --target "$GITHUB_SHA" --title "Swypetris $version" --notes-file "$notes_file" release/Swypetris.apk release/update.json release/SHA256SUMS.txt
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "Swypetris $version" --generate-notes release/Swypetris.apk release/update.json release/SHA256SUMS.txt
          fi
